apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mga-posture-corrector-service
  labels:
    app.kubernetes.io/part-of: mga
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mga-posture-corrector-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
