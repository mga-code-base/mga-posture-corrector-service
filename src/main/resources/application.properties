# =======================================================
# SERVICE CONFIGURATION
# =======================================================
spring.application.name=mga-posture-corrector-service
logging.structured.format.console=${LOG_FORMAT:ecs}
server.port=8087

# =======================================================
# SECURITY CONFIGURATION
# =======================================================
jwt.secret=${JWT_SECRET:}
# =======================================================
# MULTIPART MEDIA STREAMING BOUNDARIES
# =======================================================
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
spring.servlet.multipart.file-size-threshold=150MB

# =======================================================
# SUPABASE / AWS S3 COMPATIBLE STORAGE PROPERTIES
# =======================================================
AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
AWS_S3_REGION=${AWS_S3_REGION}
AWS_S3_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID}
AWS_S3_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY}
AWS_S3_BUCKET_NAME=gym-videos
aws.disableEc2Metadata=true

# =======================================================
# EUREKA / DISCOVERY CONFIGURATION
# =======================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# =======================================================
# ACTUATORS CONFIGURATION
# =======================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

mga.logs.kafka.topic=mga-logs

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.problemdetails.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.observability:4318/v1/traces}
management.otlp.metrics.export.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
